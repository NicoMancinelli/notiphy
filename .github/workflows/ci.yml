name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The Dockerfile builds with CGO_ENABLED=0 for a minimal image, so verify
      # that constraint holds rather than only the host build.
      - name: static build
        run: CGO_ENABLED=0 go build -ldflags "-s -w" ./...

      # notiphy ships as a single binary for homelab boxes of both
      # architectures; a cross-compile break should fail here, not at release.
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -ldflags "-s -w" -o /dev/null ./cmd/notiphy
            echo "  ok $target"
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: VERSION=ci
