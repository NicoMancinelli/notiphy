name: Release

# Cut a release by pushing a tag:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload binaries
  packages: write # push the image to GHCR

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      # Never publish a release that does not pass its own tests.
      - name: test
        run: go test ./...

      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            out="dist/notiphy_${VERSION}_${os}_${arch}"
            # Everything is embedded and the SQLite driver is pure Go, so a
            # static binary is the entire deployment.
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 GOFLAGS=-trimpath \
              go build -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/notiphy
            tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
            rm "$out"
            echo "  built ${out}.tar.gz"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 matters here: homelab boxes and Raspberry Pis are a primary
          # target for this, not an afterthought.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
